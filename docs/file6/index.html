<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="برنامج مذاكرة الملف 6 من التحليل الإنشائي: القوى الداخلية، SFD و BMD، أمثلة محلولة وحاسبة.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>القوى الداخلية CE 360</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;800&family=JetBrains+Mono:wght@400;600&family=STIX+Two+Text:wght@400;600&display=swap">
<style>
/* Layout: drafting-sheet study app. Sticky tab bar; each tab is one "sheet". V is always blue, M is always copper, loads are steel teal, reactions are red. */
:root{
  --bg:#e9eeec; --panel:#fbfcfb; --ink:#14212a; --muted:#56646b; --line:#cdd7d3; --code:#eef3f1;
  --steel:#0b6e6c; --steel-soft:#d6ebe8;
  --vcol:#1f5fa8; --vsoft:#dbe6f5; --mcol:#b0521a; --msoft:#f5e2d3; --rx:#b2362b;
  --ok:#2c7a3a; --oksoft:#dcefdf; --warn:#8a5a00; --warnsoft:#f6e8c9;
  --f-display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --f-math:"STIX Two Text","Cambria Math",Cambria,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1615; --panel:#152120; --ink:#e3ecea; --muted:#97a7a3; --line:#2b3b38; --code:#1b2a28;
  --steel:#4fc2bc; --steel-soft:#173634; --vcol:#7fb0ef; --vsoft:#18283f; --mcol:#f0a06a; --msoft:#3a261a; --rx:#f08a7e;
  --ok:#7fcf8c; --oksoft:#173322; --warn:#e9c46a; --warnsoft:#33290f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1615; --panel:#152120; --ink:#e3ecea; --muted:#97a7a3; --line:#2b3b38; --code:#1b2a28;
  --steel:#4fc2bc; --steel-soft:#173634; --vcol:#7fb0ef; --vsoft:#18283f; --mcol:#f0a06a; --msoft:#3a261a; --rx:#f08a7e;
  --ok:#7fcf8c; --oksoft:#173322; --warn:#e9c46a; --warnsoft:#33290f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.8;direction:rtl}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 60px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;line-height:1.5;margin:0}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
a{color:var(--steel)}
.ltr{direction:ltr;unicode-bidi:isolate}
.m{font-family:var(--f-math);direction:ltr;unicode-bidi:isolate}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:12px}
.top h1{font-size:clamp(1.45rem,5vw,2.05rem);font-weight:800}
.top p{margin:2px 0 0;color:var(--muted);font-size:.95rem}
.tblock{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);border:1px solid var(--ink);direction:ltr;display:grid;grid-template-columns:auto auto}
.tblock span{padding:2px 8px;border-bottom:1px solid var(--line)}
.tblock span:nth-child(odd){border-right:1px solid var(--line);color:var(--steel)}
.tblock span:nth-last-child(-n+2){border-bottom:0}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding-block:10px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tabs a{white-space:nowrap;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--panel);padding:6px 14px;border-radius:999px;font-size:.92rem}
.tabs a.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}

.lead{color:var(--muted);margin:0 0 14px;max-width:68ch}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:.76rem;letter-spacing:.08em;color:var(--steel);font-weight:700}

/* study plan */
.prog{display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--muted)}
.prog .bar{flex:1;height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:p}
.plan li{counter-increment:p;display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.plan li::before{content:counter(p);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);font-family:var(--f-mono);font-weight:600}
.plan li.done{border-color:var(--ok);background:var(--oksoft)}
.plan li.done::before{content:"✓";background:var(--ok);border-color:var(--ok);color:var(--panel)}
.plan li > div{min-width:0}
.plan b{display:block}
.plan p{margin:2px 0 6px;color:var(--muted);font-size:.92rem}
.plan .links{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-block;font-size:.8rem;padding:2px 10px;border-radius:999px;border:1px solid var(--steel);color:var(--steel);background:var(--steel-soft);text-decoration:none}
.tbtn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:5px 10px;font-size:.84rem;white-space:nowrap}
.plan li.done .tbtn{border-color:var(--ok);color:var(--ok)}

/* concepts */
.cpt h2{font-size:1.15rem;display:flex;gap:10px;align-items:baseline}
.cpt h2 .n{font-family:var(--f-mono);font-size:.85rem;color:var(--steel)}
.cpt p{margin:8px 0;max-width:72ch}
.cpt ul,.cpt ol{margin:8px 0;padding-inline-start:22px}
.cpt li{margin:3px 0}
.eq{display:block;font-family:var(--f-math);direction:ltr;text-align:left;background:var(--code);border-left:3px solid var(--steel);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:1.05rem;overflow-x:auto;white-space:pre-wrap}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;align-items:start}
.two > *{min-width:0}
.tw{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:.92rem}
.t th,.t td{border:1px solid var(--line);padding:6px 9px;text-align:start;vertical-align:top}
.t th{background:var(--steel-soft);font-weight:600}
.t td.m,.t th.m{text-align:left}
.vt{color:var(--vcol);font-weight:600}.mt{color:var(--mcol);font-weight:600}
.box{border-radius:10px;padding:10px 14px}
.box.tip{background:var(--steel-soft)}
.box.warn{background:var(--warnsoft);border-inline-start:4px solid var(--warn)}

/* example cards */
.grp{margin-top:22px}
.grp h2{font-size:1.1rem;margin-bottom:4px}
.grp > p{margin:0 0 10px;color:var(--muted);font-size:.92rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.card{display:flex;flex-direction:column;gap:4px;text-align:start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s;min-width:0}
.card:hover{border-color:var(--steel);transform:translateY(-2px)}
.card .no{font-family:var(--f-mono);font-size:.74rem;color:var(--mcol);direction:ltr;text-align:right}
.card h3{font-family:var(--f-body);font-size:1rem;font-weight:700}
.card p{margin:0;font-size:.86rem;color:var(--muted);line-height:1.65}
.card .row{display:flex;gap:6px;align-items:center;margin-top:4px}
.lvl{font-size:.72rem;font-weight:700;padding:1px 9px;border-radius:999px}
.lvl.l1{background:var(--oksoft);color:var(--ok)}.lvl.l2{background:var(--warnsoft);color:var(--warn)}.lvl.l3{background:var(--msoft);color:var(--mcol)}
.donem{font-size:.78rem;color:var(--ok);font-weight:700}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.88rem;color:var(--muted)}
.filters button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:.85rem}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}

/* example view */
.exh{display:flex;flex-direction:column;gap:4px;border-bottom:2px solid var(--ink);padding-bottom:10px}
.exh .no{font-family:var(--f-mono);font-size:.8rem;color:var(--mcol)}
.exh h2{font-size:clamp(1.2rem,4vw,1.5rem)}
.exh .src{font-size:.82rem;color:var(--muted)}
.qtext{direction:ltr;text-align:left;font-family:var(--f-math);font-size:1.08rem;margin:0}
.given{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.given li{background:var(--code);border-radius:8px;padding:6px 10px;font-size:.92rem;min-width:0}
.fig{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;overflow-x:auto}
.fig svg{display:block;width:100%;min-width:520px;height:auto}
.ctl{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:var(--panel);border-radius:10px;padding:8px 14px;font-size:.92rem}
.btn.pri{background:var(--ink);color:var(--panel)}
.btn:disabled{opacity:.4;cursor:default}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:12px;animation:in .3s ease}
.steps li::before{content:counter(s);display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--panel);font-family:var(--f-mono);font-weight:600;font-size:.9rem}
.steps li > div{min-width:0}
.steps b{display:block}
.steps .d{color:var(--muted);font-size:.93rem;display:block}
.steps .q{display:block;margin-top:5px;font-family:var(--f-math);direction:ltr;text-align:left;background:var(--code);border-left:3px solid var(--mcol);border-radius:8px;padding:6px 12px;font-size:1.05rem;white-space:pre-wrap;overflow-x:auto}
.ans{background:var(--vsoft);border:2px solid var(--vcol);border-radius:10px;padding:12px 16px}
.ans b{color:var(--vcol);direction:ltr;unicode-bidi:isolate;display:inline-block}
.idea{background:var(--msoft);border-inline-start:4px solid var(--mcol);border-radius:10px;padding:10px 14px}
.hidden-sol{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted)}
.exnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.exnav a{max-width:48%;text-decoration:none;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;color:var(--ink);font-size:.9rem}
@keyframes in{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}

/* calculator */
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.fld{display:flex;flex-direction:column;gap:2px;font-size:.82rem;color:var(--muted);min-width:0}
.fld input,.fld select{font-family:var(--f-math);font-size:1rem;padding:6px 9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;direction:ltr;width:100%}
.loads{display:flex;flex-direction:column;gap:6px}
.lrow{display:grid;grid-template-columns:110px repeat(4,minmax(0,1fr)) 38px;gap:6px;align-items:end;background:var(--code);border-radius:10px;padding:8px}
.lrow .x{width:34px;height:34px;border:1px solid var(--line);background:var(--panel);border-radius:8px;font-size:1.1rem}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.86rem;color:var(--muted)}
.presets button{border:1px solid var(--steel);background:var(--steel-soft);color:var(--steel);border-radius:999px;padding:3px 11px;font-size:.82rem}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.res div{background:var(--code);border-radius:8px;padding:7px 11px;display:flex;justify-content:space-between;gap:8px;font-size:.92rem}
.res div b{font-family:var(--f-math);direction:ltr;unicode-bidi:isolate}
.res div.hi{background:var(--msoft);outline:1.5px solid var(--mcol)}
.res div.hi b{color:var(--mcol)}
.err{color:var(--rx);font-weight:600}
@media (max-width:620px){.lrow{grid-template-columns:1fr 1fr}.lrow .x{justify-self:end}}

/* svg */
.drw text{font-family:var(--f-math);font-size:14px;fill:var(--ink)}
.drw .beam{fill:var(--ink)}
.drw .sup{fill:var(--code);stroke:var(--ink);stroke-width:1.5}
.drw .k{stroke:var(--ink);stroke-width:1.5;fill:none}
.drw .ld{stroke:var(--steel);stroke-width:1.6;fill:none}
.drw .ldf{fill:var(--steel-soft);stroke:var(--steel);stroke-width:1.4}
.drw text.ldt{fill:var(--steel);font-weight:600}
.drw .rxl{stroke:var(--rx);stroke-width:2;fill:none}
.drw text.rxt{fill:var(--rx);font-weight:600}
.drw .dim{stroke:var(--muted);stroke-width:1;fill:none}
.drw text.dimt{fill:var(--muted);font-size:13px}
.drw text.lab{font-weight:600;font-size:15px}
.drw .axis{stroke:var(--ink);stroke-width:1.2}
.drw .vf{fill:var(--vsoft);stroke:none}.drw .vl{fill:none;stroke:var(--vcol);stroke-width:2.2;stroke-linejoin:round}
.drw .mf{fill:var(--msoft);stroke:none}.drw .ml{fill:none;stroke:var(--mcol);stroke-width:2.2;stroke-linejoin:round}
.drw text.vt{fill:var(--vcol);font-weight:600;font-size:13px}.drw text.mt{fill:var(--mcol);font-weight:600;font-size:13px}
.drw text.ph{font-family:var(--f-body);font-size:13px;fill:var(--muted)}
.drw .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.drw .dotv{fill:var(--vcol)}.drw .dotm{fill:var(--mcol)}
.drw .mk-ld{fill:var(--steel)}.drw .mk-rx{fill:var(--rx)}
.drw .hinge{fill:var(--panel);stroke:var(--ink);stroke-width:2}

/* formulas, quiz */
.fcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.fcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.fcard h3{font-size:1rem;color:var(--steel);margin-bottom:4px}
.fcard ul{margin:4px 0;padding-inline-start:18px}
.fcard.warn{background:var(--warnsoft);border-color:var(--warn)}
.fcard.warn h3{color:var(--warn)}
.score{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:5;display:inline-flex;gap:10px;background:var(--ink);color:var(--panel);border-radius:10px;padding:6px 14px;margin-bottom:10px;font-size:.92rem}
.qc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.qc .qq{margin:0 0 8px;font-weight:600}
.qc .qq .num{color:var(--mcol);font-size:.8rem;margin-inline-end:6px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.opts button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;text-align:start}
.opts button.right{background:var(--oksoft);border-color:var(--ok);color:var(--ok);font-weight:700}
.opts button.wrong{background:var(--msoft);border-color:var(--mcol);color:var(--mcol)}
.opts button:disabled{cursor:default}
.why{margin:8px 0 0;font-size:.92rem;color:var(--muted);border-inline-start:3px solid var(--steel);padding-inline-start:10px}
.foot{margin-top:30px;font-size:.8rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){.card,.prog .bar i{transition:none}.steps li{animation:none}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <h1>القوى الداخلية · الملف 6</h1>
      <p>الفصل الرابع من التحليل الإنشائي: V و M و SFD و BMD، شرح وحلول وحاسبة.</p>
      <p><a href="../">→ الرجوع إلى CE 360 Study Hub</a></p>
    </div>
    <div class="tblock" aria-label="بطاقة المقرر"><span>COURSE</span><span>CE 360</span><span>CHAPTER</span><span>4 · Internal Loadings</span><span>REF</span><span>Hibbeler, Ch. 4</span></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="app"></main>
  <p class="foot">مبني من محتوى الملف 6 وأمثلة كتاب Hibbeler واختبارات 1446 و 1447. الوحدات: kN و m.</p>
</div>

<script>
/*SOLVER*/
const EPS=1e-9;
function fmt(v,n=2){if(!isFinite(v))return'—';let r=Math.round(v*10**n)/10**n;if(Math.abs(r)<1e-9)r=0;return String(r).replace('-','−')}
// spec: {L, sup:[{x,t:'pin'|'roller'|'fixed',lab}], loads:[{k:'P',x,v}|{k:'M',x,v}|{k:'w',a,b,w1,w2}], R:[{x,F,C,lab}] optional}
// P: v>0 downward. M: v>0 clockwise. w: >0 downward. F: >0 upward. C: >0 clockwise.
function solve(spec){
  const forces=[],couples=[],dists=[],reac=[];
  for(const l of spec.loads){
    if(l.k==='P')forces.push({x:l.x,F:-l.v});
    else if(l.k==='M')couples.push({x:l.x,C:l.v});
    else if(l.k==='w'&&l.b>l.a)dists.push({a:l.a,b:l.b,w1:l.w1,w2:l.w2});
  }
  // resultant force (down) and its moment about point p (ccw +) from all applied loads
  const tot=p=>{let F=0,Mo=0;
    forces.forEach(f=>{F+=-f.F;Mo+=f.F*(f.x-p)});
    couples.forEach(c=>{Mo+=-c.C});
    dists.forEach(d=>{const len=d.b-d.a,W=(d.w1+d.w2)/2*len;if(!W&&!d.w1&&!d.w2)return;
      const xc=W?d.a+len*(d.w1+2*d.w2)/(3*(d.w1+d.w2)):d.a;F+=W;Mo+=-W*(xc-p)});
    return{F,Mo}};
  if(spec.R){spec.R.forEach(r=>{if(r.F)forces.push({x:r.x,F:r.F});if(r.C)couples.push({x:r.x,C:r.C});reac.push(r)});}
  else{
    const fx=spec.sup.filter(s=>s.t==='fixed'),sp=spec.sup.filter(s=>s.t!=='fixed');
    if(fx.length===1&&sp.length===0){const s=fx[0],t=tot(s.x);
      // Ry up = total down load; reaction couple ccw Mr balances: Mr + t.Mo = 0
      const Ry=t.F,Mr=-t.Mo;forces.push({x:s.x,F:Ry});couples.push({x:s.x,C:-Mr});
      reac.push({x:s.x,F:Ry,C:-Mr,lab:s.lab});
    }else if(fx.length===0&&sp.length===2){const[a,b]=sp.slice().sort((p,q)=>p.x-q.x);
      if(Math.abs(b.x-a.x)<EPS)return{err:'الركيزتين في نفس المكان.'};
      const t=tot(a.x),Rb=-t.Mo/(b.x-a.x),Ra=t.F-Rb;
      forces.push({x:a.x,F:Ra},{x:b.x,F:Rb});reac.push({x:a.x,F:Ra,lab:a.lab},{x:b.x,F:Rb,lab:b.lab});
    }else return{err:'الحاسبة تحل كمرة determinate بس: ركيزتين (pin و roller) أو fixed وحدة.'};
  }
  const sys={spec,forces,couples,dists,reac};
  sys.VM=(x,side)=>{const inc=xi=>side<0?xi<x-EPS:xi<=x+EPS;let V=0,M=0;
    for(const f of forces)if(inc(f.x)){V+=f.F;M+=f.F*(x-f.x)}
    for(const c of couples)if(inc(c.x))M+=c.C;
    for(const d of dists)if(d.a<x){const e=Math.min(x,d.b),len=e-d.a,k=(d.w2-d.w1)/(d.b-d.a),d0=x-d.a;
      V-=d.w1*len+k*len*len/2;M-=d.w1*(d0*len-len*len/2)+k*(d0*len*len/2-len**3/3)}
    return{V,M}};
  const L=spec.L,ks=new Set([0,L]);
  (spec.sup||[]).forEach(s=>ks.add(s.x));(spec.R||[]).forEach(r=>ks.add(r.x));
  spec.loads.forEach(l=>{if(l.k==='w'){ks.add(l.a);ks.add(l.b)}else ks.add(l.x)});
  (spec.hinges||[]).forEach(h=>ks.add(h));
  sys.keys=[...ks].filter(x=>x>=-EPS&&x<=L+EPS).sort((p,q)=>p-q).filter((x,i,a)=>i===0||x-a[i-1]>1e-7);
  // V = 0 inside intervals (where V is continuous)
  sys.roots=[];
  for(let i=0;i<sys.keys.length-1;i++){const a=sys.keys[i],b=sys.keys[i+1],N=200;let x0=a+1e-7,v0=sys.VM(x0,1).V;
    for(let j=1;j<=N;j++){const x1=a+(b-a)*j/N-(j===N?1e-7:0),v1=sys.VM(x1,-1).V;
      if(Math.abs(v1)<=1e-9&&j<N&&Math.abs(v0)>1e-9){sys.roots.push(x1);x0=x1;v0=v1;continue}
      if(Math.abs(v0)<=1e-9)v0=sys.VM(x0-1e-6,1).V;
      if(Math.abs(v0)>1e-9&&Math.abs(v1)>1e-9&&v0*v1<0&&!sys.roots.some(r=>Math.abs(r-x0)<1e-5)){let lo=x0,hi=x1;for(let t=0;t<60;t++){const m=(lo+hi)/2;if(sys.VM(lo,1).V*sys.VM(m,1).V<=0)hi=m;else lo=m}sys.roots.push((lo+hi)/2)}
      x0=x1;v0=v1}}
  // extreme moments
  let mx={v:-Infinity},mn={v:Infinity};
  const pts=[];sys.keys.forEach(x=>{pts.push([x,x>0?-1:1]);pts.push([x,x<L?1:-1])});sys.roots.forEach(x=>pts.push([x,1]));
  pts.forEach(([x,s])=>{const M=sys.VM(x,s).M;if(M>mx.v)mx={v:M,x};if(M<mn.v)mn={v:M,x}});
  sys.Mmax=mx;sys.Mmin=mn;
  let vmx=0;sys.keys.forEach(x=>[-1,1].forEach(s=>{const V=sys.VM(x,s).V;if(Math.abs(V)>Math.abs(vmx))vmx=V}));sys.Vabs=vmx;
  return sys;
}

const svgT=(x,y,s,c='',a='middle')=>`<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" text-anchor="${a}" class="${c}">${s}</text>`;
const svgL=(x1,y1,x2,y2,c,ex='')=>`<line x1="${(+x1).toFixed(1)}" y1="${(+y1).toFixed(1)}" x2="${(+x2).toFixed(1)}" y2="${(+y2).toFixed(1)}" class="${c}" ${ex}/>`;
const AR=(x1,y1,x2,y2,c)=>svgL(x1,y1,x2,y2,c,`marker-end="url(#m-${c==='rxl'?'rx':'ld'})"`);
const DEFS=`<defs>${[['ld','mk-ld'],['rx','mk-rx']].map(([i,c])=>`<marker id="m-${i}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="${c}"/></marker>`).join('')}</defs>`;
function arc(cx,cy,r,cw,c){return cw?`<path d="M${cx-r*.7},${cy+r*.7} A${r},${r} 0 1,1 ${cx-r*.7},${cy-r*.7}" class="${c}" marker-end="url(#m-${c==='rxl'?'rx':'ld'})"/>`:`<path d="M${cx+r*.7},${cy+r*.7} A${r},${r} 0 1,0 ${cx+r*.7},${cy-r*.7}" class="${c}" marker-end="url(#m-${c==='rxl'?'rx':'ld'})"/>`}

function drawBeam(sys,opt={}){
  const spec=sys.spec,L=spec.L,W=780,ml=64,mr=64,pw=W-ml-mr,X=x=>ml+x*pw/L;
  let s='';const by=118;
  // distributed loads
  const ws=spec.loads.filter(l=>l.k==='w');const wmax=Math.max(1e-9,...ws.map(l=>Math.max(Math.abs(l.w1),Math.abs(l.w2))));
  const wlab=[];
  ws.forEach(l=>{const top=x=>{const w=l.w1+(l.w2-l.w1)*(x-l.a)/(l.b-l.a);return by-8-44*Math.abs(w)/wmax};
    s+=`<polygon points="${X(l.a)},${by-8} ${X(l.a)},${top(l.a)} ${X(l.b)},${top(l.b)} ${X(l.b)},${by-8}" class="ldf" opacity=".85"/>`;
    const n=Math.max(2,Math.round((X(l.b)-X(l.a))/26));
    for(let i=0;i<=n;i++){const x=l.a+(l.b-l.a)*i/n,yt=top(x);if(by-8-yt>9)s+=AR(X(x),yt,X(x),by-7,'ld')}
    if(Math.abs(l.w1-l.w2)<1e-9)wlab.push([X((l.a+l.b)/2),top(l.a)-8,`${fmt(l.w1)} kN/m`]);
    else{if(Math.abs(l.w1)>1e-9)wlab.push([X(l.a)+4,top(l.a)-8,`${fmt(l.w1)} kN/m`,'start']);if(Math.abs(l.w2)>1e-9)wlab.push([X(l.b)-4,top(l.b)-8,`${fmt(l.w2)} kN/m`,'end'])}
  });
  // beam
  s+=`<rect x="${X(0)}" y="${by-5}" width="${pw}" height="10" class="beam" rx="1"/>`;
  (spec.hinges||[]).forEach(h=>s+=`<circle cx="${X(h)}" cy="${by}" r="6" class="hinge"/>`);
  // supports
  (spec.sup||[]).forEach(su=>{const x=X(su.x);
    if(su.t==='pin')s+=`<polygon points="${x},${by+5} ${x-11},${by+24} ${x+11},${by+24}" class="sup"/>`+svgL(x-16,by+24,x+16,by+24,'k');
    else if(su.t==='roller')s+=`<polygon points="${x},${by+5} ${x-10},${by+19} ${x+10},${by+19}" class="sup"/><circle cx="${x-6}" cy="${by+23}" r="3.5" class="sup"/><circle cx="${x+6}" cy="${by+23}" r="3.5" class="sup"/>`+svgL(x-16,by+27,x+16,by+27,'k');
    else{const d=su.x<L/2?-1:1;s+=svgL(x,by-34,x,by+34,'k','stroke-width="3"');for(let i=0;i<7;i++){const y=by-30+i*10;s+=svgL(x,y,x+d*10,y+8,'k')}}
  });
  // point loads and couples
  const placed=[];
  spec.loads.forEach(l=>{if(l.k==='P'){const x=X(l.x);if(l.v>=0){s+=AR(x,by-76,x,by-7,'ld');placed.push([x+5,by-80,`${fmt(Math.abs(l.v))} kN`,'start'])}else{s+=AR(x,by+64,x,by+7,'ld');s+=svgT(x+5,by+68,`${fmt(-l.v)} kN`,'ldt','start')}}
    else if(l.k==='M'){const x=X(l.x);s+=arc(x,by,22,l.v>0,'ld');placed.push([x,by-30,`${fmt(Math.abs(l.v))} kN·m`])}});
  wlab.forEach(w=>placed.push(w));
  // nudge colliding load labels upward
  const done=[];placed.forEach(p=>{let y=p[1];for(let k=0;k<4&&done.some(d=>Math.abs(d[0]-p[0])<70&&Math.abs(d[1]-y)<15);k++)y-=16;done.push([p[0],y]);s+=svgT(p[0],y,p[2],'ldt',p[3]||'middle')});
  // reactions
  if(opt.react){sys.reac.forEach(r=>{const x=X(r.x);
    if(Math.abs(r.F)>1e-9){const up=r.F>0;s+=up?AR(x,by+92,x,by+34,'rxl'):AR(x,by+34,x,by+92,'rxl');s+=svgT(x+7,by+92,`${fmt(Math.abs(r.F))}`,'rxt','start')}
    if(r.C&&Math.abs(r.C)>1e-9){s+=arc(x,by,34,r.C>0,'rxl');s+=svgT(x+(r.x<L/2?40:-40),by-34,`${fmt(Math.abs(r.C))}`,'rxt',r.x<L/2?'start':'end')}})}
  // labels and dimensions
  const ry=opt.react?by+112:by+52;
  (spec.pts||[]).forEach(p=>s+=svgT(X(p.x),ry,p.t,'lab'));
  const dy=ry+24,dk=sys.keys;
  s+=svgL(X(0),dy,X(L),dy,'dim');
  dk.forEach(x=>s+=svgL(X(x),dy-6,X(x),dy+6,'dim'));
  for(let i=0;i<dk.length-1;i++){const a=dk[i],b=dk[i+1];if(X(b)-X(a)>30)s+=svgT((X(a)+X(b))/2,dy-5,`${fmt(b-a)} m`,'dimt')}
  let H=dy+20;
  if(opt.diag){
    const panel=(kind)=>{const top=H+18,h=150,base=top+h/2,cls=kind==='V'?'v':'m';
      const f=(x,sd)=>sys.VM(x,sd)[kind];
      let mxv=0;const samples=[];
      for(let i=0;i<dk.length-1;i++){const a=dk[i],b=dk[i+1],N=48;for(let j=0;j<=N;j++){const x=a+(b-a)*j/N,sd=j===0?1:j===N?-1:1;const v=f(x,sd);samples.push([x,v]);mxv=Math.max(mxv,Math.abs(v))}}
      mxv=mxv||1;const Y=v=>base-v/mxv*(h/2-14);
      let g=svgL(X(0),base,X(L),base,'axis');
      dk.forEach(x=>g+=svgL(X(x),top,X(x),top+h,'grid'));
      const pts=samples.map(([x,v])=>`${X(x).toFixed(1)},${Y(v).toFixed(1)}`);
      g+=`<polygon points="${X(0)},${base} ${pts.join(' ')} ${X(L)},${base}" class="${cls}f"/>`;
      g+=`<polyline points="${X(0)},${base} ${pts.join(' ')} ${X(L)},${base}" class="${cls}l"/>`;
      g+=svgT(ml-14,base+5,kind,`${cls}t`,'end');g+=svgT(ml-14,base+20,kind==='V'?'kN':'kN·m','ph','end');
      // value labels
      const lab=[];const add=(x,v,anchor)=>{if(Math.abs(v)<1e-6)return;const px=X(x)+(anchor==='end'?-4:anchor==='start'?4:0);let py=v>0?Y(v)-6:Y(v)+16;
        if(lab.some(q=>Math.abs(q[0]-px)<44&&Math.abs(q[1]-py)<14&&q[2]===fmt(v)))return;
        for(let k=0;k<3&&lab.some(q=>Math.abs(q[0]-px)<44&&Math.abs(q[1]-py)<14);k++)py+=v>0?-14:14;
        lab.push([px,py,fmt(v)]);g+=svgT(px,py,fmt(v),`${cls}t`,anchor)};
      dk.forEach((x,i)=>{const vl=i>0?f(x,-1):null,vr=i<dk.length-1?f(x,1):null;
        if(vl!=null&&vr!=null&&Math.abs(vl-vr)>1e-6){add(x,vl,'end');add(x,vr,'start')}
        else{const v=vl!=null?vl:vr;add(x,v,i===0?'start':i===dk.length-1?'end':'middle')}});
      if(kind==='V')sys.roots.forEach(x=>{g+=`<circle cx="${X(x)}" cy="${base}" r="4" class="dotv"/>`+svgT(X(x),base+(f(x-0.01,1)>0?18:-8),`x=${fmt(x)}`,'vt')});
      else sys.roots.forEach(x=>{const v=f(x,1);g+=`<circle cx="${X(x)}" cy="${Y(v)}" r="4" class="dotm"/>`;add(x,v,'middle')});
      H=top+h;return g};
    s+=panel('V');s+=panel('M');H+=10;
  }
  return `<svg class="drw" viewBox="0 0 ${W} ${H}" role="img" aria-label="رسم الكمرة${opt.diag?' مع مخطط القص والعزم':''}" direction="ltr">${DEFS}${s}</svg>`;
}
function reacText(sys){return sys.reac.map(r=>{const lab=r.lab||'R';let t='';
  if(Math.abs(r.F)>1e-9)t+=`<div><span>${lab}<sub>y</sub></span><b>${fmt(Math.abs(r.F))} kN ${r.F>0?'↑':'↓'}</b></div>`;
  if(r.C&&Math.abs(r.C)>1e-9)t+=`<div><span>M<sub>${lab}</sub></span><b>${fmt(Math.abs(r.C))} kN·m ${r.C>0?'↻':'↺'}</b></div>`;return t}).join('')}
function keyTable(sys){const L=sys.spec.L;const rows=sys.keys.map(x=>[x,x>0?sys.VM(x,-1):null,x<L?sys.VM(x,1):null,false]);
  sys.roots.forEach(x=>rows.push([x,sys.VM(x,1),sys.VM(x,1),true]));rows.sort((a,b)=>a[0]-b[0]);
  const lab=x=>{const p=(sys.spec.pts||[]).find(p=>Math.abs(p.x-x)<1e-6);return p?p.t:''};
  return `<div class="tw"><table class="t"><thead><tr><th>النقطة</th><th class="m">x (m)</th><th class="m vt">V⁻ (kN)</th><th class="m vt">V⁺ (kN)</th><th class="m mt">M⁻ (kN·m)</th><th class="m mt">M⁺ (kN·m)</th></tr></thead><tbody>${rows.map(([x,l,r,root])=>`<tr><td>${root?'V = 0':lab(x)}</td><td class="m num">${fmt(x,3)}</td><td class="m num">${l?fmt(l.V):'—'}</td><td class="m num">${r?fmt(r.V):'—'}</td><td class="m num">${l?fmt(l.M):'—'}</td><td class="m num">${r?fmt(r.M):'—'}</td></tr>`).join('')}</tbody></table></div><p class="lead" style="font-size:.85rem;margin-top:6px">⁻ قبل النقطة مباشرة، و ⁺ بعدها مباشرة. الفرق بينهم هو القفزة.</p>`}

 ${S(3,'','طريقة المقاطع خطوة بخطوة',`<ol><li>احسب الـ reactions من الـ FBD الكامل.</li><li>اقطع عند النقطة المطلوبة، واختار الجزء الأسهل (الأقل أحمال أو اللي ما فيه reactions).</li><li>ارسم الـ FBD للجزء، وحط N و V و M بالاتجاه الموجب.</li><li>الحمل الموزع: خذ محصلة الجزء المقطوع بس، مو المحصلة الكاملة.</li><li><span class="m">ΣF<sub>x</sub> = 0</span> تعطي N، و <span class="m">ΣF<sub>y</sub> = 0</span> تعطي V، و <span class="m">ΣM<sub>section</sub> = 0</span> تعطي M.</li></ol><div class="box warn">إذا طلع الجواب سالب فالاتجاه الحقيقي عكس اللي فرضته، والقيمة السالبة هي اللي تنرسم في المخطط.</div>`)}
 ${S(4,'','دوال V(x) و M(x)',`<p>نقيس x من طرف الكمرة ونكتب معادلة لكل منطقة. نحتاج منطقة جديدة عند كل:</p><ul><li>قوة مركزة أو couple.</li><li>بداية أو نهاية حمل موزع، أو تغير شكله.</li><li>Support في النص.</li></ul><p>الحمل المثلثي عند القطع شدته بالتناسب: <span class="m">w(x) = w₀·x/L</span>، ومحصلة الجزء <span class="m">½·w(x)·x</span> على بعد <span class="m">x/3</span> من القطع.</p><div class="box tip">Check: اشتق M(x) لازم يطلع V(x)، واشتق V(x) لازم يطلع w(x) (بإشارة سالبة للحمل النازل).</div>`)}
 ${S(5,'','العلاقات بين w و V و M (الطريقة الرسومية)',`<span class="eq">dV/dx = w(x)          dM/dx = V(x)
ΔV = −(مساحة الحمل الموزع)     ΔM = (مساحة الـ SFD)</span>
 <div class="tw"><table class="t"><thead><tr><th>الحمل على المنطقة</th><th class="vt">شكل الـ SFD</th><th class="mt">شكل الـ BMD</th></tr></thead><tbody>
 <tr><td>ما فيه حمل</td><td>ثابت (أفقي)</td><td>خط مستقيم مائل</td></tr><tr><td>Uniform w</td><td>خط مائل بميل −w</td><td>Parabola (درجة 2)</td></tr><tr><td>Triangular</td><td>درجة 2</td><td>درجة 3 (cubic)</td></tr><tr><td>قوة مركزة P</td><td>قفزة بمقدار P وباتجاهها</td><td>كسرة (تغير في الميل)</td></tr><tr><td>Couple M₀</td><td>ما يتأثر</td><td>قفزة بمقدار M₀: ↻ لفوق، ↺ لتحت</td></tr></tbody></table></div>
 <p>مثال يجمع كل شي: قوة مركزة 12 kN عند 2 m، وحمل 8 kN/m من 3 إلى 6 m. لاحظ الـ SFD ثابت ثم قفزة ثم ميل، والـ BMD خطوط ثم parabola وقمتها عند V = 0.</p>
 <div class="fig">${drawBeam(demo,{diag:true,react:true})}</div>`)}
 ${S(6,'','أين نحسب قيم العزوم؟',`<ol><li>بداية ونهاية الكمرة.</li><li>عند كل حمل مركز.</li><li>بداية ونهاية الأحمال الموزعة.</li><li>عند الركائز الوسطية.</li><li>قبل وبعد أي عزم مركز.</li><li>عند V = 0، وهنا يكون M الأقصى المحلي.</li></ol><p>وتأكد إن M = 0 عند الطرف الحر، وعند الـ pin والـ roller في الأطراف، وعند الـ internal hinge.</p>`)}
 ${S(7,'','الكمرات المركبة و Superposition',`<p><b>Compound beam:</b> نفك عند الـ internal hinge. نبدأ بالجزء اللي مجاهيله ثلاثة أو أقل، ونحط قوة الـ hinge على الجزء الثاني بعكس الاتجاه. العزم عند الـ hinge صفر.</p><p><b>Superposition:</b> نرسم BMD لكل حمل لحاله على كمرة بسيطة (غالباً cantilever)، ونجمع القيم. يعطي أشكال بسيطة: ثابت، خطي، parabola، cubic.</p>`)}
 ${S(8,'','الإطارات Frames',`<ol><li>احسب الـ reactions من الإطار كامل.</li><li>افصل كل عضو عند الـ joints. الـ rigid joint ينقل نفس الـ moment من عضو للثاني.</li><li>العضو المائل: حلل كل قوة لمركبة موازية للعضو (N) وعمودية عليه (V). الحمل الأفقي على عضو مائل نوزعه على طول العضو ثم نحلله.</li><li>ارسم الـ BMD على كل عضو، والعادة نرسمه على جهة الشد (أو حسب طريقة الدكتور).</li></ol><div class="box tip">في المثلث 3-4-5: <span class="m">sinθ = 0.8</span> و <span class="m">cosθ = 0.6</span> (θ = 53.13°).</div>`)}
 </div>`}

/* calculator */
let calc=store.get('calc',null)||{L:8,mode:'ss',xa:0,xb:8,loads:[{k:'w',a:0,b:8,w1:10,w2:10,x:0,v:0},{k:'P',x:3,v:25,a:0,b:0,w1:0,w2:0}]};
function calcSpec(){const c=calc,L=+c.L;let sup;
 if(c.mode==='ss')sup=[pin(+c.xa,'A'),rol(+c.xb,'B')];else if(c.mode==='cl')sup=[fix(0,'A')];else sup=[fix(L,'B')];
 const loads=c.loads.map(l=>l.k==='P'?P(+l.x,+l.v):l.k==='M'?MM(+l.x,+l.v):WW(Math.max(0,+l.a),Math.min(L,+l.b),+l.w1,+l.w2));
 const p=sup.map(s=>({x:s.x,t:s.lab}));if(!p.some(q=>Math.abs(q.x)<1e-9))p.push({x:0,t:''});
 return{L,sup,loads,pts:p}}
function calcPage(){const c=calc;
 const f=(id,lab,val,u,ex='')=>`<label class="fld" for="${id}">${lab}<input id="${id}" type="number" step="any" value="${val}" ${ex} inputmode="decimal"></label>`;
 return `<p class="lead">اكتب أي كمرة determinate وتطلع لك الـ reactions والـ SFD والـ BMD وأكبر عزم فوراً. استخدمها عشان تتأكد من حلك، مو بدال الحل.</p>
 <div class="presets"><span>جاهزة من الأمثلة:</span>${EX.filter(e=>e.spec&&!e.spec.R&&(e.spec.sup.length===2&&e.spec.sup.every(s=>s.t!=='fixed')||e.spec.sup.length===1)).map(e=>`<button data-preset="${e.id}">${e.no}</button>`).join('')}</div>
 <section class="sheet stack" style="margin-top:10px"><div class="eyebrow">الكمرة</div>
 <div class="form">${f('c-L','الطول L (m)',c.L)}
 <label class="fld" for="c-mode">نوع الركائز<select id="c-mode"><option value="ss" ${c.mode==='ss'?'selected':''}>Pin + Roller</option><option value="cl" ${c.mode==='cl'?'selected':''}>Cantilever: fixed يسار</option><option value="cr" ${c.mode==='cr'?'selected':''}>Cantilever: fixed يمين</option></select></label>
 ${c.mode==='ss'?f('c-xa','مكان الـ pin A (m)',c.xa)+f('c-xb','مكان الـ roller B (m)',c.xb):''}</div>
 <div class="eyebrow">الأحمال <span style="color:var(--muted);font-weight:400;letter-spacing:0">(P لتحت موجب، M مع عقارب الساعة موجب، w لتحت موجب)</span></div>
 <div class="loads">${c.loads.map((l,i)=>`<div class="lrow"><label class="fld" for="l-${i}-k">النوع<select id="l-${i}-k" data-li="${i}" data-f="k"><option value="P" ${l.k==='P'?'selected':''}>قوة P</option><option value="w" ${l.k==='w'?'selected':''}>حمل موزع w</option><option value="M" ${l.k==='M'?'selected':''}>عزم M</option></select></label>
  ${l.k==='w'?['a','b','w1','w2'].map((k,j)=>`<label class="fld" for="l-${i}-${k}">${['من a (m)','إلى b (m)','w عند a','w عند b'][j]}<input id="l-${i}-${k}" type="number" step="any" value="${l[k]}" data-li="${i}" data-f="${k}"></label>`).join(''):`<label class="fld" for="l-${i}-x">المكان x (m)<input id="l-${i}-x" type="number" step="any" value="${l.x}" data-li="${i}" data-f="x"></label><label class="fld" for="l-${i}-v">${l.k==='P'?'P (kN)':'M (kN·m)'}<input id="l-${i}-v" type="number" step="any" value="${l.v}" data-li="${i}" data-f="v"></label><span></span><span></span>`}
  <button class="x" data-del="${i}" aria-label="احذف الحمل">×</button></div>`).join('')}</div>
 <div class="ctl"><button class="btn" data-add="P">+ قوة</button><button class="btn" data-add="w">+ حمل موزع</button><button class="btn" data-add="M">+ عزم</button></div></section>
 <section class="sheet stack" id="calc-out" style="margin-top:12px"></section>`}
function calcOut(){const el=document.getElementById('calc-out');if(!el)return;const spec=calcSpec();
 if(!(spec.L>0)){el.innerHTML='<p class="err">اكتب طول أكبر من صفر.</p>';return}
 const bad=spec.sup.find(s=>s.x<0||s.x>spec.L);if(bad){el.innerHTML='<p class="err">مكان الركيزة لازم يكون بين 0 و L.</p>';return}
 const sys=solve(spec);if(sys.err){el.innerHTML=`<p class="err">${sys.err}</p>`;return}
 el.innerHTML=`<div class="eyebrow">النتيجة</div><div class="res">${reacText(sys)}<div class="hi"><span>M<sub>max</sub></span><b>${fmt(sys.Mmax.v)} @ x = ${fmt(sys.Mmax.x)}</b></div><div class="hi"><span>M<sub>min</sub></span><b>${fmt(sys.Mmin.v)} @ x = ${fmt(sys.Mmin.x)}</b></div><div><span>|V|<sub>max</sub></span><b>${fmt(Math.abs(sys.Vabs))} kN</b></div>${sys.roots.map(x=>`<div><span>V = 0 عند</span><b>x = ${fmt(x,3)} m</b></div>`).join('')}</div><div class="fig">${drawBeam(sys,{diag:true,react:true})}</div>${keyTable(sys)}`}

function route(){const h=(location.hash||'#plan').slice(1);let tab=h,html;
 if(h.startsWith('ex-')){tab='examples';html=exPage(h.slice(3))}
 else if(h.startsWith('learn-')){tab='learn';html=learnPage()}
 else html=({plan:planPage,learn:learnPage,examples:examplesPage,calc:calcPage,formulas:formulasPage,quiz:quizPage}[h]||planPage)();
 if(!TABS.some(t=>t[0]===tab))tab='plan';
 document.getElementById('tabs').innerHTML=TABS.map(([id,l])=>`<a href="#${id}" class="${id===tab?'on':''}">${l}</a>`).join('');
 app.innerHTML=html;if(tab==='calc')calcOut();
 if(h.startsWith('learn-')){const el=document.getElementById(h);if(el)el.scrollIntoView()}else window.scrollTo(0,0);
}
function rerender(keepScroll=true){const y=window.scrollY;const h=(location.hash||'#plan').slice(1);
 app.innerHTML=h.startsWith('ex-')?exPage(h.slice(3)):({plan:planPage,examples:examplesPage,calc:calcPage,quiz:quizPage}[h]||planPage)();
 if(h==='calc')calcOut();if(keepScroll)window.scrollTo(0,y)}
window.addEventListener('hashchange',route);
app.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.plan){planDone[d.plan]=!planDone[d.plan];store.set('plan',planDone);rerender()}
 else if(d.lvl!=null){lvlF=+d.lvl;rerender()}
 else if(d.step){reveal[d.step]=(reveal[d.step]||0)+1;rerender()}
 else if(d.all){reveal[d.all]=99;rerender()}
 else if(d.hide){reveal[d.hide]=0;rerender()}
 else if(d.exdone){exDone[d.exdone]=!exDone[d.exdone];store.set('ex',exDone);rerender()}
 else if(d.q!=null){qState[d.q]=+d.k;rerender()}
 else if(d.qreset){qState={};rerender(false)}
 else if(d.tocalc||d.preset){const e=EX.find(x=>x.id===(d.tocalc||d.preset)),s=e.spec,fx=s.sup.find(q=>q.t==='fixed');
  calc={L:s.L,mode:fx?(fx.x<s.L/2?'cl':'cr'):'ss',xa:fx?0:s.sup[0].x,xb:fx?s.L:s.sup[1].x,loads:s.loads.map(l=>Object.assign({x:0,v:0,a:0,b:0,w1:0,w2:0},l))};
  store.set('calc',calc);if(d.tocalc)location.hash='calc';else rerender()}
 else if(d.add){const L=+calc.L||1;calc.loads.push(d.add==='w'?{k:'w',a:0,b:L,w1:10,w2:10,x:0,v:0}:{k:d.add,x:L/2,v:10,a:0,b:L,w1:10,w2:10});store.set('calc',calc);rerender()}
 else if(d.del!=null){calc.loads.splice(+d.del,1);store.set('calc',calc);rerender()}
});
app.addEventListener('input',ev=>{const t=ev.target;if(!t.closest('.sheet')||location.hash!=='#calc')return;
 if(t.id==='c-L'){calc.L=t.value;if(calc.mode==='ss'&&+calc.xb>+t.value)calc.xb=t.value}
 else if(t.id==='c-xa')calc.xa=t.value;else if(t.id==='c-xb')calc.xb=t.value;
 else if(t.dataset.li!=null&&t.dataset.f!=='k')calc.loads[+t.dataset.li][t.dataset.f]=t.value;else return;
 store.set('calc',calc);calcOut()});
app.addEventListener('change',ev=>{const t=ev.target;if(location.hash!=='#calc')return;
 if(t.id==='c-mode'){calc.mode=t.value;if(t.value==='ss'){calc.xa=0;calc.xb=calc.L}store.set('calc',calc);rerender()}
 else if(t.dataset.f==='k'){calc.loads[+t.dataset.li].k=t.value;store.set('calc',calc);rerender()}});
route();
</script>
